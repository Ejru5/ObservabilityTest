dependencies = [
    "mistralai>=1.0.0",
    "mistralai-workflows[mistralai]>=3.0.0,<4",
    "pydantic",
    "python-dotenv",
    "reportlab",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.11",
]
